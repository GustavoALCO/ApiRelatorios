events {}

http {
    client_max_body_size 100M;

    server {
        listen 80;
        server_name gustavoalvescorrea.cloud www.gustavoalvescorrea.cloud;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name gustavoalvescorrea.cloud www.gustavoalvescorrea.cloud;

        ssl_certificate     /etc/letsencrypt/live/gustavoalvescorrea.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gustavoalvescorrea.cloud/privkey.pem;

        location / {
            proxy_pass http://apirelatorios.webapi:8080;

            # Mantém a conexão HTTP/1.1
            proxy_http_version 1.1;

            # Timeouts (1 hora)
            proxy_connect_timeout 3600s;
            proxy_send_timeout    3600s;
            proxy_read_timeout    3600s;
            send_timeout          3600s;

            # Evita problemas com respostas longas/streaming
            proxy_buffering off;

            # Encaminha os cabeçalhos corretos para a API
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
